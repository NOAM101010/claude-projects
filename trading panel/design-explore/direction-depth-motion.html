<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradePanel — כיוון: עומק ותנועה</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=JetBrains+Mono:wght@500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#07080b; --bg-2:#0b0d12;
    --card: rgba(255,255,255,.045); --border: rgba(255,255,255,.1); --border-hi: rgba(255,255,255,.22);
    --text:#a3a3ab; --text-h:#f5f5f7; --text-dim:#74747c;
    --pos-2:#4ade80; --neg-2:#f87171;
    --accent:#d99a2b; --accent-2:#e8b341;
    --serif:'Frank Ruhl Libre', Georgia, serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Heebo', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#07080b; color:var(--text); font-family:var(--sans);
    min-height:100vh; overflow-x:hidden; position:relative;
    perspective:1400px;
  }
  .num{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-variant-numeric:tabular-nums;}

  /* ==== drifting ambient orbs, layered behind everything ==== */
  .orb{position:fixed; border-radius:50%; filter:blur(60px); pointer-events:none; z-index:0; opacity:.5;}
  .orb1{width:520px; height:520px; top:-160px; right:-120px; background:radial-gradient(circle, rgba(217,154,43,.35), transparent 70%); animation: drift1 26s ease-in-out infinite;}
  .orb2{width:460px; height:460px; bottom:-140px; left:-100px; background:radial-gradient(circle, rgba(34,197,94,.22), transparent 70%); animation: drift2 32s ease-in-out infinite;}
  .orb3{width:340px; height:340px; top:40%; left:60%; background:radial-gradient(circle, rgba(239,68,68,.12), transparent 70%); animation: drift3 22s ease-in-out infinite;}
  @keyframes drift1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-60px,50px);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(50px,-40px);} }
  @keyframes drift3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,30px) scale(1.15);} }

  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000 40%, transparent 90%);
  }

  .wrap{max-width:1160px; margin:0 auto; padding:36px 22px 60px; position:relative; z-index:1;}

  /* ==== parallax layers — respond to mousemove via JS (data-depth) ==== */
  .layer{ transition: transform .25s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d; will-change:transform; }

  .hero{
    display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:34px;
  }
  @media (max-width:860px){ .hero{grid-template-columns:1fr;} }

  .glass-deep{
    position:relative; border-radius:22px;
    background: linear-gradient(155deg, rgba(255,255,255,.07), rgba(255,255,255,.015) 60%), rgba(12,14,18,.55);
    border:1px solid var(--border);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 40px 80px -32px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .glass-deep::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background: linear-gradient(155deg, rgba(255,255,255,.18), transparent 40%, rgba(217,154,43,.12) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  .clock-card{ padding:30px; }
  .eyebrow{display:inline-flex; align-items:center; gap:9px; font-size:10.5px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:var(--text-dim); font-family:var(--mono);}
  .eyebrow::before{content:''; width:22px; height:1px; background:linear-gradient(90deg, var(--accent-2), transparent);}
  .clock-time{font-family:var(--mono); font-weight:700; font-size:clamp(42px,5.5vw,58px); color:var(--text-h); margin:12px 0 6px; direction:ltr; text-align:left;}
  .clock-status{font-size:14px; color:var(--text-h); font-weight:600;}
  .clock-status .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--pos-2); margin-inline-end:8px; box-shadow:0 0 10px rgba(74,222,128,.8);}

  .stack{position:relative; height:100%;}
  .float-card{
    position:absolute; border-radius:18px; padding:16px 18px;
    background: linear-gradient(155deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1px solid var(--border-hi);
    backdrop-filter: blur(14px);
    box-shadow: 0 24px 50px -20px rgba(0,0,0,.7);
    animation: floaty 7s ease-in-out infinite;
  }
  .float-card.a{ top:0; right:0; width:62%; z-index:3; animation-delay:0s; }
  .float-card.b{ top:38%; right:26%; width:58%; z-index:2; opacity:.9; animation-delay:1.2s; }
  .float-card.c{ top:74%; right:8%; width:50%; z-index:1; opacity:.75; animation-delay:2.4s; }
  @keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .float-card .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim);}
  .float-card .val{font-family:var(--mono); font-weight:800; font-size:22px; color:var(--text-h); margin-top:4px; direction:ltr;}
  .float-card .chg{font-family:var(--mono); font-size:12px; font-weight:700; margin-top:2px; direction:ltr;}
  .up{color:var(--pos-2);} .down{color:var(--neg-2);}

  .section{margin-top:38px;}
  .section-title{font-family:var(--serif); font-weight:900; font-size:21px; color:var(--text-h); margin:0 0 14px; letter-spacing:-.01em;}

  /* heatmap as depth-tiered cards */
  .heatmap{display:grid; grid-template-columns:repeat(6,1fr); gap:10px;}
  @media (max-width:760px){.heatmap{grid-template-columns:repeat(3,1fr);}}
  .heat-cell{
    border-radius:12px; padding:13px 12px; font-family:var(--mono);
    border:1px solid var(--border); backdrop-filter: blur(10px);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease;
  }
  .heat-cell:hover{ transform: translateY(-6px) scale(1.03); box-shadow:0 20px 34px -14px rgba(0,0,0,.6); }
  .heat-cell .name{font-size:11px; font-weight:700; opacity:.92;}
  .heat-cell .pct{font-size:15px; font-weight:800; margin-top:4px; direction:ltr;}
  .hp1{background:rgba(34,197,94,.28); color:#dcfce7;} .hp2{background:rgba(34,197,94,.16); color:#86efac;} .hp3{background:rgba(34,197,94,.07); color:#bbf7d0;}
  .hn1{background:rgba(239,68,68,.09); color:#fecaca;} .hn2{background:rgba(239,68,68,.2); color:#fca5a5;} .hn3{background:rgba(239,68,68,.32); color:#fee2e2;}

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  .tile{
    border-radius:16px; padding:17px 18px; position:relative;
    background: linear-gradient(155deg, rgba(255,255,255,.05), rgba(255,255,255,.01)), rgba(13,15,20,.6);
    border:1px solid var(--border); backdrop-filter: blur(12px);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s ease, box-shadow .3s ease;
  }
  .tile:hover{ transform: translateY(-6px) rotateX(2deg); border-color:var(--border-hi); box-shadow:0 30px 50px -22px rgba(0,0,0,.7); }
  .tile .lbl{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim);}
  .tile .price{font-family:var(--mono); font-size:21px; font-weight:800; color:var(--text-h); margin-top:8px; direction:ltr;}
  .tile .chg{font-family:var(--mono); font-size:12.5px; font-weight:700; margin-top:3px; direction:ltr;}

  .fg-num{font-family:var(--mono); font-weight:800; font-size:26px; color:var(--accent-2); margin-top:8px;}
  .fg-bar{height:6px; border-radius:99px; margin-top:10px; background:linear-gradient(90deg,#ef4444,#eab308,#22c55e); position:relative;}
  .fg-bar::after{content:''; position:absolute; top:-3px; width:2px; height:12px; background:#fff; left:64%; box-shadow:0 0 8px rgba(255,255,255,.8);}

  footer{margin-top:44px; text-align:center; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--text-dim); text-transform:uppercase;}
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="grid-bg"></div>

  <div class="wrap">
    <section class="hero">
      <div class="glass-deep clock-card layer" data-depth="14">
        <span class="eyebrow">שעון השוק</span>
        <div class="clock-time num" id="clock">14:32:07</div>
        <div class="clock-status"><span class="dot"></span>NYSE פתוח · נסגר בעוד 1:27:53</div>
      </div>

      <div class="stack layer" data-depth="26">
        <div class="float-card a">
          <div class="lbl">S&amp;P 500</div>
          <div class="val num">582.14</div>
          <div class="chg num up">▲ +1.84%</div>
        </div>
        <div class="float-card b">
          <div class="lbl">Nasdaq 100</div>
          <div class="val num">498.02</div>
          <div class="chg num up">▲ +2.11%</div>
        </div>
        <div class="float-card c">
          <div class="lbl">BTC/USD</div>
          <div class="val num">67,842</div>
          <div class="chg num up">▲ +3.42%</div>
        </div>
      </div>
    </section>

    <section class="section layer" data-depth="6">
      <h2 class="section-title">מפת חום סקטורים</h2>
      <div class="heatmap" id="heatmap"></div>
    </section>

    <section class="section layer" data-depth="8">
      <h2 class="section-title">מדדים מובילים</h2>
      <div class="grid" id="indices"></div>
    </section>

    <section class="section layer" data-depth="8">
      <h2 class="section-title">סחורות ואג״ח</h2>
      <div class="grid" id="commodities"></div>
    </section>

    <section class="section layer" data-depth="10">
      <h2 class="section-title">קריפטו</h2>
      <div class="grid" id="crypto"></div>
    </section>

    <footer>TradePanel · Depth &amp; Motion · כיוון עיצובי לבחינה בלבד</footer>
  </div>

<script>
  const clockEl = document.getElementById('clock');
  let t0 = new Date(2026,0,1,14,32,7);
  setInterval(()=>{ t0.setSeconds(t0.getSeconds()+1); clockEl.textContent = t0.toTimeString().slice(0,8); },1000);

  function tile(label, price, chg){
    const up = chg >= 0;
    return `<div class="tile">
      <div class="lbl">${label}</div>
      <div class="price num">${price}</div>
      <div class="chg num ${up?'up':'down'}">${up?'▲':'▼'} ${up?'+':''}${chg.toFixed(2)}%</div>
    </div>`;
  }
  document.getElementById('indices').innerHTML =
    tile('SPY','582.14',1.84)+tile('QQQ','498.02',2.11)+tile('DIA','412.67',0.62)+tile('IWM','221.05',-0.34);
  document.getElementById('commodities').innerHTML =
    tile('זהב (GLD)','2,384.10',0.28)+tile('נפט (USO)','74.32',-0.91)+tile('דולר (UUP)','101.44',0.12)+tile('אג״ח (TLT)','92.18',0.14);
  document.getElementById('crypto').innerHTML =
    tile('BTC','67,842',3.42)+tile('ETH','3,214',-1.05)+tile('SOL','162.30',5.87)+
    `<div class="tile"><div class="lbl">Fear &amp; Greed</div><div class="fg-num num">71</div><div class="fg-bar"></div></div>`;

  const sectors = [
    ['טכנולוגיה',2.4,'hp1'],['בריאות',1.1,'hp2'],['פיננסים',0.6,'hp3'],
    ['תעשייה',-0.3,'hn1'],['אנרגיה',-1.4,'hn2'],['נדל״ן',-2.1,'hn3'],
    ['צריכה',1.8,'hp2'],['תשתיות',0.9,'hp3'],['חומרי גלם',-0.6,'hn1'],
    ['תקשורת',2.9,'hp1'],['שירותים',0.2,'hp3'],['תעופה',-1.9,'hn2'],
  ];
  document.getElementById('heatmap').innerHTML = sectors.map(([n,p,cls])=>
    `<div class="heat-cell ${cls}"><div class="name">${n}</div><div class="pct num">${p>0?'+':''}${p.toFixed(1)}%</div></div>`
  ).join('');

  // mouse-driven parallax across layered elements
  const layers = document.querySelectorAll('.layer');
  window.addEventListener('mousemove', (e)=>{
    const dx = (e.clientX / window.innerWidth) - 0.5;
    const dy = (e.clientY / window.innerHeight) - 0.5;
    layers.forEach(el=>{
      const depth = parseFloat(el.dataset.depth) || 8;
      el.style.transform = `translate3d(${dx*depth}px, ${dy*depth}px, 0)`;
    });
  });
</script>
</body>
</html>

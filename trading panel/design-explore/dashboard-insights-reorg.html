<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradePanel — Dashboard: ארגון מחדש של Insights (3 כיוונים)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=JetBrains+Mono:wght@500;600;700;800&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#07080b; --bg-2:#0b0d12; --overlay-tint:255,255,255;
    --card: rgba(255,255,255,.035); --border: rgba(255,255,255,.09); --border-hi: rgba(255,255,255,.17);
    --text:#a3a3ab; --text-h:#f2f2f4; --text-dim:#74747c; --text-label: rgba(253,246,232,.82);
    --pnl-pos:#22c55e; --pnl-pos-2:#4ade80; --pnl-neg:#ef4444; --pnl-neg-2:#f87171;
    --accent:#d99a2b; --accent-2:#e8b341; --amber-rgb:217,154,43; --amber-hot-rgb:232,179,65;
    --metal-1:#0c0e11; --metal-2:#15181d; --metal-mid:#101216; --metal-edge: rgba(255,255,255,.08); --metal-hi: rgba(255,255,255,.06);
    --serif:'Frank Ruhl Libre', Georgia, serif; --mono:'JetBrains Mono', ui-monospace, monospace; --sans:'Heebo', system-ui, sans-serif;
    --shadow: 0 18px 40px -22px rgba(0,0,0,.75);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{min-height:100vh; padding-bottom:70px;
    background: radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,154,43,.05), transparent 55%),
                radial-gradient(ellipse 800px 600px at 100% 20%, rgba(34,197,94,.03), transparent 55%), var(--bg);
  }
  .num{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .wrap{max-width:900px; margin:0 auto; padding:0 20px;}
  @media (min-width:1024px){ .wrap{ max-width:1400px; padding:0 40px; } }
  @media (min-width:1600px){ .wrap{ max-width:1880px; padding:0 56px; } }

  .metal-panel{ position:relative; border:1px solid var(--metal-edge); border-radius:14px;
    background: linear-gradient(180deg, var(--metal-2) 0%, var(--metal-mid) 55%, var(--metal-1) 100%);
    box-shadow: inset 0 1px 0 var(--metal-hi), var(--shadow); }
  .glass{ background: linear-gradient(180deg, rgba(255,255,255,.045) 0%, rgba(255,255,255,.015) 100%), var(--bg-2);
    border:1px solid var(--border); border-radius:14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05), var(--shadow); }
  .holo-edge{ position:relative; isolation:isolate; }
  .holo-edge::after{ content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background: linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.02) 28%, transparent 58%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; opacity:.7; z-index:1; }
  .holo-edge--amber::after{ background: linear-gradient(180deg, rgba(232,179,65,.35) 0%, rgba(217,154,43,.06) 32%, transparent 60%); }

  .eyebrow{ display:inline-flex; align-items:center; gap:9px; font-size:10px; font-weight:700; letter-spacing:.24em;
    text-transform:uppercase; color:var(--text-dim); font-family:var(--mono); }
  .eyebrow::before{content:''; width:22px; height:1px; background:linear-gradient(90deg, var(--accent-2), transparent);}
  .det-chip{ direction:ltr; display:inline-flex; align-items:center; gap:5px; padding:3px 8px;
    border:1px solid rgba(217,154,43,.4); background:rgba(6,8,13,.75); border-radius:999px;
    font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:rgba(245,225,190,.86); white-space:nowrap; }
  .det-chip--up{ border-color:rgba(34,197,94,.45); color:var(--pnl-pos-2); }
  .det-chip--down{ border-color:rgba(239,68,68,.45); color:var(--pnl-neg-2); }
  .det-chip--soon{ border-color:rgba(255,255,255,.18); color:var(--text-dim); }

  .page-head{ padding:28px 0 8px; }
  .page-title{ font-family:var(--serif); font-weight:900; font-size:clamp(22px,3.2vw,32px); color:var(--text-h); margin:6px 0 0; }

  /* ==== view switcher (segmented control) ==== */
  .view-switch-wrap{ display:flex; justify-content:center; margin:26px 0 8px; }
  .view-switch{ display:inline-flex; gap:3px; padding:4px; border-radius:12px; border:1px solid var(--metal-edge);
    background: rgba(12,14,17,.75); }
  .view-btn{ font:inherit; font-size:12.5px; font-weight:700; padding:8px 16px; border-radius:9px; border:none;
    background:none; color:var(--text-dim); cursor:pointer; transition:color .16s ease, background .16s ease; }
  .view-btn[data-active="true"]{ color:var(--accent-2); background: rgba(232,179,65,.1); }
  .view-btn:hover:not([data-active="true"]){ color:var(--text-h); }
  .view-note{ text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:26px; }
  .view-note b{ color:var(--accent-2); }

  .section-block{ margin-top:34px; }
  .section-title{ font-family:var(--serif); font-weight:900; font-size:19px; color:var(--text-h); margin:0 0 14px; }

  /* ================= shared card look ================= */
  .insight-card{ border-radius:14px; padding:17px 18px; position:relative; overflow:hidden; min-width:0; }
  .ic-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .ic-title{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; color:var(--text-h); }
  .ic-title svg{ width:16px; height:16px; color:var(--accent-2); flex-shrink:0; }
  .ic-chips{ display:flex; gap:5px; flex-shrink:0; }
  .ic-body{ font-size:12.5px; color:var(--text); line-height:1.6; }
  .ic-stat-row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:4px; }
  .ic-stat-row .k{ color:var(--text-label); font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; }
  .ic-stat-row .v{ font-family:var(--mono); font-weight:800; font-size:14px; color:var(--text-h); direction:ltr; }
  .ic-stat-row .v.pos{ color:var(--pnl-pos-2); } .ic-stat-row .v.neg{ color:var(--pnl-neg-2); }
  .ic-bar-track{ height:7px; border-radius:99px; background:rgba(255,255,255,.06); overflow:hidden; margin-top:10px; }
  .ic-bar-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .ic-bar-fill.danger{ background:linear-gradient(90deg, #ef4444, #f87171); }
  .ic-hist{ display:flex; align-items:flex-end; gap:4px; height:56px; margin-top:10px; }
  .ic-hist .bar{ flex:1; border-radius:3px 3px 0 0; background:rgba(232,179,65,.5); min-height:4px; }
  .ic-hist .bar.neg{ background:rgba(239,68,68,.45); }
  .ic-list{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .ic-list-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; }
  .ic-list-row .name{ font-weight:700; color:var(--text-h); font-family:var(--mono); }
  .ic-list-row .pnl{ font-family:var(--mono); font-weight:700; direction:ltr; }
  .soon-ribbon{ position:absolute; top:12px; left:-32px; transform:rotate(-38deg); background:rgba(232,179,65,.18);
    color:var(--accent-2); font-family:var(--mono); font-size:9px; font-weight:800; letter-spacing:.1em; padding:2px 34px; }
  .locked-card{ opacity:.5; }
  .locked-card .ic-body{ filter:blur(2.5px); user-select:none; }

  /* card grid used in tabs + accordion */
  .cards-grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:640px){ .cards-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (min-width:1280px){ .cards-grid{ grid-template-columns:repeat(3,1fr); } }

  /* ================= VIEW 1: category tabs ================= */
  #view-tabs{ display:none; }
  #view-tabs.active{ display:block; }
  .cat-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .cat-tab{ font:inherit; font-size:12.5px; font-weight:700; padding:8px 15px; border-radius:999px;
    border:1px solid var(--border); background:rgba(255,255,255,.02); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:color .16s ease, border-color .16s ease, background .16s ease; }
  .cat-tab .count{ font-family:var(--mono); font-size:10px; opacity:.7; }
  .cat-tab[data-active="true"]{ color:var(--accent-2); border-color:rgba(232,179,65,.4); background:rgba(232,179,65,.08); }
  .cat-tab:hover:not([data-active="true"]){ color:var(--text-h); border-color:var(--border-hi); }
  .cat-tab .swatch{ width:7px; height:7px; border-radius:50%; }
  .sw-risk{ background:#f87171; } .sw-perf{ background:#4ade80; } .sw-behavior{ background:#e8b341; }

  /* ================= VIEW 2: accordion ================= */
  #view-accordion{ display:none; }
  #view-accordion.active{ display:block; }
  .accordion-section{ margin-bottom:12px; }
  .accordion-head{ display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-radius:14px;
    cursor:pointer; user-select:none; }
  .accordion-head .left{ display:flex; align-items:center; gap:10px; }
  .accordion-head .swatch{ width:9px; height:9px; border-radius:50%; }
  .accordion-head h4{ margin:0; font-family:var(--serif); font-weight:900; font-size:16px; color:var(--text-h); }
  .accordion-head .sub{ font-family:var(--mono); font-size:10.5px; color:var(--text-dim); letter-spacing:.04em; }
  .accordion-head .chev{ width:16px; height:16px; color:var(--text-dim); transition:transform .2s ease; }
  .accordion-section[data-open="true"] .chev{ transform:rotate(180deg); }
  .accordion-body{ overflow:hidden; max-height:0; transition:max-height .28s ease; }
  .accordion-section[data-open="true"] .accordion-body{ max-height:900px; }
  .accordion-body-inner{ padding:6px 2px 4px; }

  /* ================= VIEW 3: grouped grid with headers ================= */
  #view-grouped{ display:none; }
  #view-grouped.active{ display:block; }
  .group-block{ margin-bottom:30px; }
  .group-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .group-head .swatch{ width:9px; height:9px; border-radius:50%; }
  .group-head h4{ margin:0; font-family:var(--serif); font-weight:900; font-size:17px; color:var(--text-h); }
  .group-head .sub{ font-family:var(--mono); font-size:10.5px; color:var(--text-dim); letter-spacing:.04em; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="page-head">
      <span class="eyebrow">USD · Insights</span>
      <h1 class="page-title">לוח בקרה — אזור תובנות</h1>
    </div>

    <div class="view-switch-wrap">
      <div class="view-switch">
        <button type="button" class="view-btn" data-view="tabs" data-active="true">טאבים לפי קטגוריה</button>
        <button type="button" class="view-btn" data-view="accordion">אקורדיון</button>
        <button type="button" class="view-btn" data-view="grouped">רשת מקובצת עם כותרות</button>
      </div>
    </div>
    <p class="view-note">3 כיוונים לאותו תוכן — לחצו כדי להשוות. <b>סיכון</b> / <b>ביצועים</b> / <b>התנהגות</b>, כל כרטיס נשאר אותו כרטיס.</p>

    <!-- ============ VIEW 1: TABS ============ -->
    <div id="view-tabs" class="active">
      <div class="cat-tabs">
        <button type="button" class="cat-tab" data-cat="all" data-active="true">הכל <span class="count">8</span></button>
        <button type="button" class="cat-tab" data-cat="risk"><span class="swatch sw-risk"></span> סיכון <span class="count">3</span></button>
        <button type="button" class="cat-tab" data-cat="perf"><span class="swatch sw-perf"></span> ביצועים <span class="count">4</span></button>
        <button type="button" class="cat-tab" data-cat="behavior"><span class="swatch sw-behavior"></span> התנהגות <span class="count">1</span></button>
      </div>
      <div class="cards-grid" id="tabsGrid"></div>
    </div>

    <!-- ============ VIEW 2: ACCORDION ============ -->
    <div id="view-accordion">
      <div class="accordion-section metal-panel holo-edge" data-open="true" data-cat="risk">
        <div class="accordion-head">
          <div class="left"><span class="swatch sw-risk"></span><h4>סיכון</h4><span class="sub">Risk · 3</span></div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="accordion-body"><div class="accordion-body-inner"><div class="cards-grid" data-slot="risk"></div></div></div>
      </div>
      <div class="accordion-section metal-panel holo-edge" data-open="false" data-cat="perf">
        <div class="accordion-head">
          <div class="left"><span class="swatch sw-perf"></span><h4>ביצועים</h4><span class="sub">Performance · 4</span></div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="accordion-body"><div class="accordion-body-inner"><div class="cards-grid" data-slot="perf"></div></div></div>
      </div>
      <div class="accordion-section metal-panel holo-edge" data-open="false" data-cat="behavior">
        <div class="accordion-head">
          <div class="left"><span class="swatch sw-behavior"></span><h4>התנהגות</h4><span class="sub">Behavior · 1</span></div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="accordion-body"><div class="accordion-body-inner"><div class="cards-grid" data-slot="behavior"></div></div></div>
      </div>
    </div>

    <!-- ============ VIEW 3: GROUPED GRID WITH HEADERS ============ -->
    <div id="view-grouped">
      <div class="group-block">
        <div class="group-head"><span class="swatch sw-risk"></span><h4>סיכון</h4><span class="sub">Risk</span></div>
        <div class="cards-grid" data-slot="riskG"></div>
      </div>
      <div class="group-block">
        <div class="group-head"><span class="swatch sw-perf"></span><h4>ביצועים</h4><span class="sub">Performance</span></div>
        <div class="cards-grid" data-slot="perfG"></div>
      </div>
      <div class="group-block">
        <div class="group-head"><span class="swatch sw-behavior"></span><h4>התנהגות</h4><span class="sub">Behavior</span></div>
        <div class="cards-grid" data-slot="behaviorG"></div>
      </div>
    </div>
  </div>

<script>
  // ==== card templates (real-ish numbers, matching progress.md/screen-dashboard.html) ====
  function icon(path){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${path}</svg>`; }

  const CARDS = [
    { cat:'risk', title:'תקציב סיכון יומי', badge:'DAY', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      html:`<div class="ic-stat-row"><span class="k">בשימוש היום</span><span class="v num">$420 / $800</span></div>
            <div class="ic-bar-track"><div class="ic-bar-fill" style="width:52%"></div></div>
            <div class="ic-stat-row" style="margin-top:10px;"><span class="k">נותר</span><span class="v pos num">$380</span></div>` },

    { cat:'risk', title:'התפלגות R-Multiple', badge:'PRO',
      icon:'<path d="M4 19V9M10 19V5M16 19v-7M22 19v-3"/>',
      html:`<div class="ic-hist">
              <div class="bar neg" style="height:20%"></div><div class="bar neg" style="height:38%"></div>
              <div class="bar" style="height:30%"></div><div class="bar" style="height:70%"></div>
              <div class="bar" style="height:95%"></div><div class="bar" style="height:44%"></div>
            </div>
            <div class="ic-stat-row" style="margin-top:10px;"><span class="k">ממוצע R</span><span class="v pos num">+1.42R</span></div>` },

    { cat:'risk', title:'התאמות SL/TP', badge:null, icon:'<path d="M3 12h18M3 12l5-5M3 12l5 5"/><path d="M21 12l-5-5M21 12l-5 5"/>',
      html:`<div class="ic-stat-row"><span class="k">טריידים עם התאמה</span><span class="v num">38%</span></div>
            <div class="ic-stat-row" style="margin-top:8px;"><span class="k">Win% עם התאמה</span><span class="v pos num">71%</span></div>
            <div class="ic-stat-row"><span class="k">Win% בלי התאמה</span><span class="v num">58%</span></div>` },

    { cat:'risk', title:'מגבלת טריידים ליום', badge:'DAY', soon:true, icon:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 11h16"/>',
      html:`<div class="ic-body">התראה כשעוברים את מספר הטריידים היומי שהוגדר מראש — עוזר למנוע over-trading אחרי רצף הפסדים.</div>` },

    { cat:'perf', title:'ביצועי Setup', badge:'PRO', icon:'<path d="M9 3h6l1 4H8l1-4z"/><path d="M6 7h12l-1 14H7L6 7z"/>',
      html:`<div class="ic-list">
              <div class="ic-list-row"><span class="name">Breakout</span><span class="pnl pos num">+$4,820</span></div>
              <div class="ic-list-row"><span class="name">Pullback</span><span class="pnl pos num">+$2,110</span></div>
              <div class="ic-list-row"><span class="name">Gap&amp;Go</span><span class="pnl neg num">-$380</span></div>
            </div>` },

    { cat:'perf', title:'ביצועים לפי שעה', badge:'DAY · PRO', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
      html:`<div class="ic-hist">
              <div class="bar" style="height:30%"></div><div class="bar" style="height:60%"></div>
              <div class="bar" style="height:90%"></div><div class="bar neg" style="height:25%"></div>
              <div class="bar" style="height:50%"></div><div class="bar neg" style="height:18%"></div>
            </div>
            <div class="ic-stat-row" style="margin-top:10px;"><span class="k">שעת שיא</span><span class="v pos num">10:00–11:00</span></div>` },

    { cat:'perf', title:'סיכום שבועי', badge:null, icon:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/>',
      html:`<div class="ic-stat-row"><span class="k">P&amp;L השבוע</span><span class="v pos num">+$2,340</span></div>
            <div class="ic-stat-row" style="margin-top:8px;"><span class="k">טריידים</span><span class="v num">9</span></div>
            <div class="ic-stat-row"><span class="k">Win Rate</span><span class="v num">67%</span></div>` },

    { cat:'perf', title:'משקל תיק', badge:'LONG-TERM', soon:true, icon:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18"/>',
      html:`<div class="ic-body">פילוח החזקות פתוחות לפי אחוז מהתיק הכולל — יעזור לזהות ריכוזיות-יתר בסקטור/סימבול בודד.</div>` },

    { cat:'perf', title:'השוואת Workspaces', badge:'PRO', soon:true, icon:'<rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/>',
      html:`<div class="ic-body">השוואת ביצועים בין כמה חשבונות/אסטרטגיות שמנוהלים כ-workspaces נפרדים באותו חשבון Pro.</div>` },

    { cat:'behavior', title:'מקור עיקרי להפסדים', badge:null, icon:'<path d="M12 9v4m0 4h.01M10.3 3.9L2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
      html:`<div class="ic-list">
              <div class="ic-list-row"><span class="name">יציאה מוקדמת מדי</span><span class="pnl neg num">-$1,240</span></div>
              <div class="ic-list-row"><span class="name">בלי סטופ מוגדר</span><span class="pnl neg num">-$860</span></div>
              <div class="ic-list-row"><span class="name">גודל פוזיציה חורג</span><span class="pnl neg num">-$540</span></div>
            </div>` },
  ];

  function renderCard(c){
    const badgeChip = c.badge ? `<span class="det-chip">${c.badge}</span>` : '';
    const soonRibbon = c.soon ? `<span class="soon-ribbon">בקרוב</span>` : '';
    const lockedClass = c.soon ? 'locked-card' : '';
    return `<div class="insight-card metal-panel holo-edge ${lockedClass}" data-cat="${c.cat}">
      ${soonRibbon}
      <div class="ic-head">
        <span class="ic-title">${icon(c.icon)}${c.title}</span>
        <span class="ic-chips">${badgeChip}</span>
      </div>
      <div class="ic-body">${c.html}</div>
    </div>`;
  }

  // ---- view 1: tabs ----
  const tabsGrid = document.getElementById('tabsGrid');
  function paintTabs(filter){
    tabsGrid.innerHTML = CARDS.filter(c => filter==='all' || c.cat===filter).map(renderCard).join('');
  }
  paintTabs('all');
  document.querySelectorAll('.cat-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.cat-tab').forEach(t=>t.dataset.active='false');
      tab.dataset.active='true';
      paintTabs(tab.dataset.cat);
    });
  });

  // ---- view 2: accordion ----
  ['risk','perf','behavior'].forEach(cat=>{
    document.querySelector(`[data-slot="${cat}"]`).innerHTML = CARDS.filter(c=>c.cat===cat).map(renderCard).join('');
  });
  document.querySelectorAll('.accordion-head').forEach(head=>{
    head.addEventListener('click', ()=>{
      const section = head.closest('.accordion-section');
      section.dataset.open = section.dataset.open === 'true' ? 'false' : 'true';
    });
  });

  // ---- view 3: grouped grid ----
  document.querySelector('[data-slot="riskG"]').innerHTML = CARDS.filter(c=>c.cat==='risk').map(renderCard).join('');
  document.querySelector('[data-slot="perfG"]').innerHTML = CARDS.filter(c=>c.cat==='perf').map(renderCard).join('');
  document.querySelector('[data-slot="behaviorG"]').innerHTML = CARDS.filter(c=>c.cat==='behavior').map(renderCard).join('');

  // ---- top-level view switch ----
  document.querySelectorAll('.view-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.view-btn').forEach(b=>b.dataset.active='false');
      btn.dataset.active='true';
      ['tabs','accordion','grouped'].forEach(v=>{
        document.getElementById('view-'+v).classList.toggle('active', v===btn.dataset.view);
      });
    });
  });
</script>
</body>
</html>
